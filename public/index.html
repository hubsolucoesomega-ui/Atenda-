<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATENDA</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f6f9;--surface:#fff;--s2:#eef1f6;--text:#1b2130;--muted:#5d6676;--border:#d9dee7;--primary:#2456d6;--primary-soft:#e6edfc;--ok:#1f8a4c;--ok-soft:#e5f5ec;--warn:#9a5d00;--warn-soft:#fff3dc;--danger:#c43030;--danger-soft:#fbe7e7;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1218;--surface:#171b23;--s2:#1e2430;--text:#e7eaf0;--muted:#9aa3b2;--border:#2a3140;--primary:#7fa2ff;--primary-soft:#1d2a4a;--ok:#5fd28e;--ok-soft:#14301f;--warn:#f0b35a;--warn-soft:#352913;--danger:#ff7b7b;--danger-soft:#3a1d1d;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--s2:#1e2430;--text:#e7eaf0;--muted:#9aa3b2;--border:#2a3140;--primary:#7fa2ff;--primary-soft:#1d2a4a;--ok:#5fd28e;--ok-soft:#14301f;--warn:#f0b35a;--warn-soft:#352913;--danger:#ff7b7b;--danger-soft:#3a1d1d;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--primary);text-decoration:none}
h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:14px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted);font-size:13px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.04em;color:var(--primary);font-size:17px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav a{padding:7px 10px;border-radius:8px;color:var(--text);white-space:nowrap;font-size:14px}
nav a.on{background:var(--primary);color:#fff}
.who{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
@media (max-width:720px){nav{order:3;width:100%;flex:none;padding-bottom:4px}}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--s2);border-radius:10px;padding:12px}
.kpi strong{display:block;font-size:22px}
.kpi span{color:var(--muted);font-size:13px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr.link:hover td{background:var(--s2);cursor:pointer}
.table-scroll{overflow-x:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--s2);white-space:nowrap}
.b-urg{background:var(--danger-soft);color:var(--danger)} .b-alta{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-late{background:var(--danger-soft);color:var(--danger)}
.b-pend{background:var(--warn-soft);color:var(--warn)} .b-appr{background:var(--ok-soft);color:var(--ok)} .b-ret{background:var(--danger-soft);color:var(--danger)}
.pill-ok{color:var(--ok)} .pill-late{color:var(--danger)}
.notice{background:var(--primary-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.issues{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.issues ul{margin:4px 0 0;padding-left:18px}
form.stack{display:grid;gap:12px}
form.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:6px;color:var(--text)}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:80px;resize:vertical}
.btn{appearance:none;font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tab{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.bar-track{background:var(--s2);border-radius:6px;height:10px;overflow:hidden}
.bar-fill{background:var(--primary);height:100%;border-radius:6px}
.msg{border-left:3px solid var(--border);padding:6px 10px;margin:0 0 10px}
.msg.sys{border-color:var(--warn);background:var(--warn-soft);border-radius:6px}
.msg.int{border-color:var(--primary)}
.msg small{color:var(--muted)}
.kanban{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:start}
.col{background:var(--s2);border-radius:10px;padding:10px;min-height:120px}
.col h3{margin:4px 2px 10px;font-size:14px}
.cardk{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.cardk strong{display:block;font-size:14px}
.dl{display:grid;gap:8px 16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:0 0 12px}
.dl div{background:var(--s2);border-radius:8px;padding:8px 10px}
.dl dt{color:var(--muted);font-size:12px}
.dl dd{margin:0;white-space:pre-wrap}
.empty{color:var(--muted);padding:18px;text-align:center}
.login{max-width:380px;margin:48px auto}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:640px}
.cal .wd{background:var(--s2);padding:6px;font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cal .day{background:var(--surface);min-height:96px;padding:4px;font-size:12px}
.cal .day.off{background:var(--s2)}
.cal .dnum{font-weight:600;margin-bottom:3px}
.cal .day.today .dnum{background:var(--primary);color:#fff;border-radius:999px;display:inline-block;padding:0 7px}
.ev{display:block;font-size:11px;border-radius:5px;padding:2px 5px;margin:2px 0;color:var(--text);background:var(--s2);text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev-open{background:var(--primary-soft)} .ev-prog{background:var(--warn-soft)} .ev-done{background:var(--ok-soft)} .ev-cancel{background:var(--danger-soft);text-decoration:line-through}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:8px;transition:transform .25s;z-index:50;max-width:92vw;font-size:14px}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger);color:#fff}
.upload{display:flex;flex-direction:column;gap:6px}
.upload input[type=file]{padding:6px}
.opt-row{display:flex;gap:8px;align-items:center}
.opt-row input{flex:1}
.thumb{display:block;max-width:100%;max-height:200px;border-radius:8px;margin:4px 0}
@media print{header.top,.no-print,#toast{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border-color:#bbb}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <span class="brand">ATENDA</span>
    <nav id="nav" aria-label="Módulos"></nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Carregando…</p></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ==================== Estado e constantes ==================== */
let S = null;                         // estado vindo de /api/state
let STATUSES = [], PRIORITIES = [], CATEGORIES = [], SECTOR_TYPES = [], TEMPLATES = {}, ROLE_LABEL = {};
const PERM_LABEL = {configure:'Gerenciar configurações', receive:'Receber e atender chamados', report:'Enviar relatórios', review:'Validar relatórios'};
const ROUTES = {dashboard:'Dashboard', chamados:'Chamados', agenda:'Agenda', kanban:'Kanban', relatorios:'Relatórios', nfe:'NF-e', clientes:'Clientes', tarefas:'Tarefas', sla:'SLA', config:'Configurações'};
const SLA_LABEL = {ok:'Em dia', warning:'Em risco', late:'Vencido'};
const SLA_CLASS = {ok:'b-ok', warning:'b-warn', late:'b-late'};
const PRIO_CLASS = {Urgente:'b-urg', Alta:'b-alta', Normal:'', Baixa:''};

/* UI local (não persistido) */
let CF = {q:'', status:'', cat:'', arch: false};
let RF = '';
let repTab = 'validacao';
let cfgTab = 'geral';
let selRep = null;
let showClientForm = false;
let AG = {ym: null, mode: 'mes', tec: ''};
let G = {show:false, type:'', status:'', fmt:'resumo'};
let busy = false;

const $ = (s, r = document) => r.querySelector(s);
const h = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const digits = s => String(s || '').replace(/\D/g, '');
const csvEsc = v => { const t = String(v ?? ''); return '"' + (/^[=+@\-]/.test(t) ? "'" + t : t).replaceAll('"', '""') + '"'; };
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const can = p => !!S && S.me.perms.includes(p);
const agents = () => S.users.filter(u => u.active).map(u => u.name);
const fiscalOk = () => digits(S.fiscal.cnpj).length === 14 && !!S.fiscal.legalName.trim() && S.fiscal.issRate > 0;

function syncConsts() {
  STATUSES = S.statuses; PRIORITIES = S.priorities; CATEGORIES = S.categories;
  SECTOR_TYPES = S.sectorTypes; TEMPLATES = S.templates; ROLE_LABEL = S.roleLabels;
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, 3200);
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ==================== API ==================== */
async function api(method, path, data) {
  const opt = {method, credentials: 'same-origin', headers: {}};
  if (data !== undefined) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(data); }
  const res = await fetch(path, opt);
  let out = {}; try { out = await res.json(); } catch (e) { /* sem corpo */ }
  if (res.status === 401 && path !== '/api/login') { S = null; renderLogin(); throw new Error(out.error || 'Sessão expirada.'); }
  if (!res.ok) throw new Error(out.error || 'Não foi possível concluir a ação.');
  return out;
}
async function refresh() { S = await api('GET', '/api/state'); syncConsts(); }
/** Executa uma ação no servidor, recarrega o estado e redesenha a tela. */
async function act(fn) {
  if (busy) return;
  busy = true;
  try {
    const msg = await fn();
    await refresh();
    if (msg) toast(msg);
    render();
  } catch (err) { toast(err.message, true); }
  finally { busy = false; }
}

/* ==================== Telas ==================== */
function selectOpts(list, cur, first) {
  return (first !== undefined ? `<option value="">${h(first)}</option>` : '') + list.map(v => `<option value="${h(v)}" ${v === cur ? 'selected' : ''}>${h(v)}</option>`).join('');
}
function badgePrio(p) { return `<span class="badge ${PRIO_CLASS[p] || ''}">${h(p)}</span>`; }
function badgeSla(sla, due) { return `<span class="badge ${SLA_CLASS[sla]}">${SLA_LABEL[sla]}</span> <span class="muted">${h(due)}</span>`; }
function reportBadge(s) {
  return s === 'approved' ? '<span class="badge b-appr">Validado</span>' : s === 'returned' ? '<span class="badge b-ret">Devolvido</span>' : '<span class="badge b-pend">Aguardando validação</span>';
}
function pageHead(title, desc, extra = '') {
  return `<div class="actions" style="justify-content:space-between;margin-bottom:6px"><div><h1>${h(title)}</h1><p class="sub">${h(desc)}</p></div>${extra}</div>`;
}
function bars(entries, total) {
  if (!entries.length) return '<div class="empty">Sem dados</div>';
  return '<div class="bars">' + entries.map(([l, n]) => `<div class="bar-row"><span>${h(l)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct(n, total)}%"></div></div><strong>${n}</strong></div>`).join('') + '</div>';
}
function countBy(list, fn, order) {
  const m = new Map((order || []).map(k => [k, 0]));
  list.forEach(x => { const k = fn(x); m.set(k, (m.get(k) || 0) + 1); });
  return [...m.entries()].filter(([, n]) => n > 0);
}
function summarizeTickets(list) {
  const total = list.length, resolved = list.filter(t => t.status === 'Resolvido').length;
  return {total, resolved, open: total - resolved,
    urgent: list.filter(t => t.priority === 'Urgente' || t.priority === 'Alta').length,
    ok: list.filter(t => t.sla === 'ok').length, warning: list.filter(t => t.sla === 'warning').length, late: list.filter(t => t.sla === 'late').length};
}
function ticketTable(list) {
  if (!list.length) return '<div class="empty">Nenhum chamado encontrado.</div>';
  return `<div class="table-scroll"><table><thead><tr><th>Nº</th><th>Assunto</th><th>Cliente</th><th>Tipo</th><th>Prioridade</th><th>Status</th><th>Responsável</th><th>SLA</th></tr></thead><tbody>
    ${list.map(t => `<tr class="link" data-go="#/chamados/${t.id}"><td>#${t.id}</td><td>${h(t.title)}</td><td>${h(t.client)}</td><td>${h(t.category)}</td><td>${badgePrio(t.priority)}</td><td>${h(t.status)}</td><td>${h(t.agent)}</td><td>${badgeSla(t.sla, t.due)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function filteredTickets() {
  const q = CF.q.toLowerCase();
  return (CF.arch ? S.archivedTickets : S.tickets).filter(t => (!q || `${t.id} ${t.title} ${t.client}`.toLowerCase().includes(q)) && (!CF.status || t.status === CF.status) && (!CF.cat || t.category === CF.cat));
}

function dashView() {
  const s = summarizeTickets(S.tickets);
  const pending = S.reports.filter(r => r.status === 'pending').length;
  return pageHead('Dashboard', 'Uma visão geral do atendimento.') + `
    <div class="grid" style="margin-bottom:16px">
      <div class="kpi"><strong>${s.total}</strong><span>Chamados</span></div>
      <div class="kpi"><strong>${s.open}</strong><span>Em aberto</span></div>
      <div class="kpi"><strong class="pill-late">${s.late}</strong><span>SLA vencido</span></div>
      <div class="kpi"><strong>${pending}</strong><span>Relatórios aguardando validação</span></div>
      <div class="kpi"><strong>${S.invoices.length}</strong><span>NF-e demonstrativas</span></div>
    </div>
    <div class="two">
      <div class="card"><h2>Chamados por status</h2>${bars(countBy(S.tickets, t => t.status, STATUSES), s.total)}</div>
      <div class="card"><h2>Chamados por tipo</h2>${bars(countBy(S.tickets, t => t.category, CATEGORIES), s.total)}</div>
    </div>
    <div class="card"><h2>Últimos chamados</h2>${ticketTable(S.tickets.slice(0, 5))}</div>`;
}
function chamadosView() {
  return pageHead('Chamados', 'Receba solicitações, acompanhe conversas e conclua atendimentos.',
    `<div class="actions"><button class="btn" data-act="csvTickets">Exportar CSV</button>${can('receive') ? '<a class="btn primary" href="#/novo">Novo chamado</a>' : ''}</div>`) + `
    <div class="tabs no-print">${[['ativos', 'Ativos'], ['arquivados', 'Arquivados']].map(([k, l]) => `<button class="tab ${(CF.arch ? 'arquivados' : 'ativos') === k ? 'on' : ''}" data-act="chamTab" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="card">
      <form class="grid2 no-print" style="margin-bottom:12px" onsubmit="return false">
        <label>Buscar<input type="search" data-input="search" placeholder="Número, assunto ou cliente" value="${h(CF.q)}"></label>
        <label>Status<select data-change="filter" data-k="status">${selectOpts(STATUSES, CF.status, 'Todos')}</select></label>
        <label>Tipo de chamado<select data-change="filter" data-k="cat">${selectOpts(CATEGORIES, CF.cat, 'Todos')}</select></label>
      </form>
      <div id="ticket-rows">${ticketTable(filteredTickets())}</div>
    </div>`;
}
function novoView() {
  if (!can('receive')) return pageHead('Novo chamado', '') + '<div class="card empty">Seu perfil não abre chamados.</div>';
  return pageHead('Novo chamado', 'Registre uma solicitação do cliente.') + `
    <div class="card"><form class="stack" data-form="newTicket">
      <label>Assunto<input name="title" required minlength="5" maxlength="160" placeholder="Qual é a solicitação?"></label>
      <div class="grid2">
        <label>Cliente<select name="client" required data-change="clientPick"><option value="">Selecione</option>${S.clients.filter(c => c.active).map(c => `<option value="${h(c.id)}">${h(c.company)}</option>`).join('')}</select></label>
        <label>Tipo de chamado<select name="category" required><option value="">Selecione</option>${selectOpts(CATEGORIES)}</select></label>
        <label>Setor<select name="sector" required><option value="">Selecione</option>${S.sectors.filter(s => s.active).map(s => `<option value="${h(s.id)}">${h(s.name)}</option>`).join('')}</select></label>
        <label>Prioridade<select name="priority" required>${selectOpts(PRIORITIES, 'Normal')}</select></label>
      </div>
      <div id="client-info"></div>
      <label>Descrição<textarea name="description" required maxlength="4000"></textarea></label>
      ${S.ticketFields.length ? `<fieldset style="border:1px solid var(--border);border-radius:10px;padding:12px">
        <legend class="muted">Informações adicionais</legend>
        <div class="grid2">${fieldsHtml(S.ticketFields, 't_')}</div>
      </fieldset>` : ''}
      <fieldset style="border:1px solid var(--border);border-radius:10px;padding:12px">
        <legend class="muted">Visita técnica</legend>
        <label class="inline"><input type="checkbox" name="visit" data-change="toggleVisit"> Gerar agendamento na agenda ao abrir o chamado</label>
        <div id="visit-box" style="display:none;margin-top:10px">${agendaFieldsHtml('a_')}</div>
      </fieldset>
      <div class="actions"><button class="btn primary" type="submit">Abrir chamado</button><a class="btn" href="#/chamados">Cancelar</a></div>
    </form></div>`;
}
/* Campos dinâmicos (relatórios e chamado). prefix: 'f_' nos relatórios, 't_' no chamado. */
function fieldsHtml(fields, prefix = 'f_', optional = false) {
  return fields.map(f => {
    const name = prefix + f.id;
    const req = f.required ? 'required' : '';
    const label = `${h(f.label)}${f.required ? ' <span style="color:var(--danger)">★</span>' : ''}`;
    let input;
    if (f.kind === 'textarea') input = `<textarea name="${name}" ${req}></textarea>`;
    else if (f.kind === 'number') input = `<input type="number" step="any" min="0" name="${name}" ${req}>`;
    else if (f.kind === 'date') input = `<input type="date" name="${name}" ${req}>`;
    else if (f.kind === 'select') input = selectFieldHtml(f, name, req);
    else if (f.kind === 'attachment') input = `<span class="upload"><input type="file" accept="image/*,application/pdf" data-change="upload"><input type="hidden" name="${name}"><span class="muted" data-status></span></span>`;
    else input = `<input name="${name}" maxlength="255" ${req}>`;
    const row = `<label>${label}${input}</label>`;
    // Campos opcionais ficam ocultos até serem adicionados pelo "+ Mais".
    return optional && !f.required ? `<div data-opt="${h(f.id)}" style="display:none">${row}</div>` : row;
  }).join('');
}
/* Campos do relatório: obrigatórios à vista; opcionais e itens extras entram pelo "+ Mais". */
function reportFieldsHtml(tplId) {
  const fields = TEMPLATES[tplId].fields;
  const optional = fields.filter(f => !f.required);
  return `${fieldsHtml(fields, 'f_', true)}
    <div class="stack" data-mais>
      <label>+ Mais<select data-change="maisAdd"><option value="">Adicionar campo ou item</option>${optional.map(f => `<option value="opt:${h(f.id)}">${h(f.label)}</option>`).join('')}<option value="text">Item com texto livre</option><option value="file">Item com anexo (imagem ou PDF)</option></select></label>
      <div data-extras class="stack"></div>
    </div>`;

/* Envia o arquivo assim que é escolhido; o formulário recebe só o id do anexo. */
async function uploadFile(input) {
  const hidden = input.parentElement.querySelector('input[type=hidden]');
  const status = input.parentElement.querySelector('[data-status]');
  const file = input.files[0];
  hidden.value = '';
  if (!file) { status.textContent = ''; return; }
  if (file.size > MAX_UPLOAD) { input.value = ''; status.textContent = ''; toast('Arquivo acima de 5 MB.', true); return; }
  status.textContent = 'Enviando…';
  try {
    const res = await fetch('/api/attachments', {method: 'POST', credentials: 'same-origin',
      headers: {'content-type': file.type || 'application/octet-stream', 'x-filename': encodeURIComponent(file.name)}, body: file});
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || 'Não foi possível enviar o arquivo.');
    hidden.value = out.id;
    status.textContent = `✓ ${out.name}`;
  } catch (err) { input.value = ''; status.textContent = ''; toast(err.message, true); }
}

    <form class="stack" data-form="login">

    </form></div>`;
  document.title = 'ATENDA — Entrar';
}
function renderNav() {
  $('#nav').innerHTML = Object.entries(ROUTES).map(([k, l]) => `<a href="#/${k}" data-r="${k}">${l}</a>`).join('');
  $('#who').innerHTML = `<span>${h(S.me.name)} · ${h(ROLE_LABEL[S.me.role])}</span><button class="btn sm" data-act="logout">Sair</button>`;
}
function render() {
  if (!S) return renderLogin();
  renderNav();
  const [name, id] = location.hash.replace(/^#\/?/, '').split('/');
  const key = name === 'chamados' && id ? 'chamados' : (name === 'novo' ? 'novo' : (VIEWS[name] ? name : 'dashboard'));
  const active = key === 'novo' ? 'chamados' : key;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === active));
  $('#app').innerHTML = key === 'chamados' && id ? detalheView(id) : VIEWS[key]();
  document.title = `ATENDA — ${key === 'novo' ? 'Novo chamado' : ROUTES[key]}`;
}

const FORMS = {
  async newTicket(f) {
    const d = Object.fromEntries(new FormData(f));
    const payload = {title: d.title, client: d.client, category: d.category, sector: d.sector, priority: d.priority, description: d.description};
    payload.custom = collectFields(f, S.ticketFields, 't_');
    if (f.elements.visit.checked) payload.visit = agendaPayload(f, 'a_');
    const r = await api('POST', '/api/tickets', payload);
    location.hash = `#/chamados/${r.id}`;
    return 'Chamado criado.';
  },
  async reply(f) {
    const body = f.elements.body.value.trim();
    await api('POST', `/api/tickets/${f.dataset.id}/messages`, {body, internal: f.elements.internal.checked});
    return 'Mensagem registrada.';
  },
  async report(f) {
    const tpl = f.elements.tpl.value;
    const values = collectFields(f, TEMPLATES[tpl].fields, 'f_');
    const extras = [...f.querySelectorAll('.extra-row')].map(row => {
      const label = row.querySelector('input[name^="xl_"]').value.trim();
      if (!label) throw new Error('Dê um nome para cada item extra.');
      return {label, kind: row.dataset.kind, value: row.querySelector('[name^="xv_"]').value};
    });
    await api('POST', `/api/tickets/${f.dataset.id}/reports`, {template: tpl, service: f.elements.svc.value, values, extras});
    return 'Relatório enviado para validação.';
  },
  async review(f, submitter) {
    const approve = !!submitter && submitter.value === 'approve';
    await api('POST', `/api/reports/${f.dataset.id}/review`, {approve, feedback: f.elements.feedback.value});
    selRep = null;
    return approve ? 'Relatório validado. NF-e demonstrativa gerada.' : 'Relatório devolvido para correção.';
  },
  async gen(f) {
    G = {show: true, type: f.elements.type.value, status: f.elements.status.value, fmt: f.elements.fmt.value};
    return '';
  },
  async addField(f) {
    const body = {
      label: f.elements.label.value, kind: f.elements.kind.value, required: f.elements.required.checked,
      options: [...f.querySelectorAll('input[name=opt]')].map(i => i.value),
      free: f.elements.free ? f.elements.free.checked : false
    };
    if (f.dataset.scope === 'report') {
      body.template = f.elements.template.value;
      await api('POST', '/api/report-fields', body);
      return 'Campo adicionado ao relatório.';
    }
    await api('POST', '/api/ticket-fields', body);
    return 'Campo adicionado ao chamado.';
  },
  async agenda(f) {
    await api('POST', `/api/tickets/${f.dataset.id}/agenda`, agendaPayload(f, 'a_'));
    return 'Visita agendada.';
  },
  async sla(f) {
    const data = {};
    PRIORITIES.forEach(p => { data[p] = {resp: f.elements['resp_' + p].value, res: f.elements['res_' + p].value}; });
    await api('PUT', '/api/sla', data);
    return 'Políticas salvas.';
  },
  async sector(f) {
    await api('POST', '/api/sectors', {name: f.elements.name.value, type: f.elements.type.value});
    return 'Setor criado.';
  },
  async service(f) {
    await api('POST', '/api/services', {name: f.elements.name.value, code: f.elements.code.value});
    return 'Serviço criado.';
  },
  async fiscal(f) {
    const v = Object.fromEntries(new FormData(f));
    await api('PUT', '/api/fiscal', {...v, issRate: Number(v.issRate)});
    return 'Dados fiscais salvos.';
  },
  async client(f) {
    await api('POST', '/api/clients', Object.fromEntries(new FormData(f)));
    showClientForm = false;
    return 'Cliente cadastrado.';
  },
  async user(f) {
    await api('POST', '/api/users', Object.fromEntries(new FormData(f)));
    return 'Usuário criado. Entregue a senha inicial com segurança.';
  },
  async task(f) {
    await api('POST', '/api/tasks', Object.fromEntries(new FormData(f)));
    return 'Tarefa criada.';
  }
};
const CHANGES = {
  filter(el) { CF[el.dataset.k] = el.value; },
  agTec(el) { AG.tec = el.value; },
  toggleVisit(el) { const box = $('#visit-box'); if (box) box.style.display = el.checked ? 'block' : 'none'; },
  agendaStatus(el) { return act(() => api('PATCH', `/api/agenda/${el.dataset.id}`, {status: el.value}).then(() => 'Status do agendamento atualizado.')); },
  filterRep(el) { RF = el.value; },
  tplChange(el) { const box = $('#repFields'); if (box) box.innerHTML = reportFieldsHtml(el.value); },
  maisAdd(el) {
    const v = el.value; el.value = '';
    if (!v) return;
    if (v.startsWith('opt:')) {
      const row = el.closest('form').querySelector(`[data-opt="${v.slice(4)}"]`);
      if (row) row.style.display = 'block';
      const opt = el.querySelector(`option[value="${v}"]`); if (opt) opt.disabled = true;
      return;
    }
    const list = el.closest('[data-mais]').querySelector('[data-extras]');
    if (list.querySelectorAll('.extra-row').length >= MAX_EXTRAS) { toast(`Limite de ${MAX_EXTRAS} itens extras por relatório.`, true); return; }
    list.insertAdjacentHTML('beforeend', extraRowHtml(v === 'file' ? 'attachment' : 'text'));
  },
  upload(el) { return uploadFile(el); },
  selectFree(el) { const box = el.parentElement.querySelector('[data-free-box]'); if (box) box.style.display = el.value === '__free__' ? 'block' : 'none'; },
  kindChange(el) { const box = el.closest('form').querySelector('[data-opts-box]'); if (box) box.style.display = el.value === 'select' ? 'block' : 'none'; },
  clientPick(el) { const box = $('#client-info'); if (box) box.innerHTML = clientCardHtml(S.clients.find(c => c.id === el.value)); },
  setStatus(el) { return act(() => api('PATCH', `/api/tickets/${el.dataset.id}`, {status: el.value}).then(() => 'Status atualizado.')); },
  moveTicket(el) { return act(() => api('PATCH', `/api/tickets/${el.dataset.id}`, {status: el.value}).then(() => 'Chamado movido.')); },
  setAgent(el) { return act(() => api('PATCH', `/api/tickets/${el.dataset.id}`, {agent: el.value}).then(() => 'Responsável atualizado.')); },
  toggleService(el) { return act(() => api('PATCH', `/api/services/${el.dataset.id}`, {active: el.checked}).then(() => 'Serviço atualizado.')); }
};
const ACTS = {
  toggleTask(el) {
    const t = S.tasks.find(x => x.id === el.dataset.id);
    if (t) return act(() => api('PATCH', `/api/tasks/${t.id}`, {done: !t.done}));
  },
  pickReport(el) { selRep = el.dataset.id; render(); setTimeout(() => { const p = $('#review'); if (p) p.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 0); },
  closeReview() { selRep = null; render(); },
  repTab(el) { repTab = el.dataset.v; render(); },
  agMode(el) { AG.mode = el.dataset.v; render(); },
  agNav(el) {
    if (el.dataset.v === '0') { AG.ym = todayIso().slice(0, 7); render(); return; }
    const [y, m] = AG.ym.split('-').map(Number);
    const d = new Date(y, m - 1 + Number(el.dataset.v), 1);
    AG.ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    render();
  },
  genType(el) { G = {show: true, type: el.dataset.v, status: '', fmt: G.fmt}; render(); },
  chamTab(el) { CF.arch = el.dataset.v === 'arquivados'; render(); },
  archiveTicket(el) {
    const arch = el.dataset.v === '1';
    if (arch && !confirm('Arquivar este chamado? Ele sai da lista e do Kanban. O histórico e a NF-e continuam guardados.')) return;
    return act(() => api('PATCH', `/api/tickets/${el.dataset.id}`, {archived: arch}).then(() => {
      if (arch) { CF.arch = false; location.hash = '#/chamados'; }
      return arch ? 'Chamado arquivado.' : 'Chamado restaurado.';
    }));
  },
  toggleClient(el) {
    const active = el.dataset.v === '1';
    return act(() => api('PATCH', `/api/clients/${el.dataset.id}`, {active}).then(() => active ? 'Cliente reativado.' : 'Cliente arquivado.'));
  },
  archTask(el) {
    const arch = el.dataset.v === '1';
    return act(() => api('PATCH', `/api/tasks/${el.dataset.id}`, {archived: arch}).then(() => arch ? 'Tarefa arquivada.' : 'Tarefa restaurada.'));
  },
  delField(el) {
    if (!confirm('Excluir este campo? Dados já salvos não são alterados.')) return;
    const url = el.dataset.scope === 'ticket' ? `/api/ticket-fields/${el.dataset.id}` : `/api/report-fields/${el.dataset.template}/${el.dataset.id}`;
    return act(() => api('DELETE', url, {}).then(() => 'Campo excluído.'));
  },
  editOpts(el) {
    const id = el.dataset.id;
    const field = el.dataset.scope === 'ticket' ? S.ticketFields.find(x => x.id === id) : (TEMPLATES[el.dataset.template] || {fields: []}).fields.find(x => x.id === id);
    if (!field) return;
    const txt = prompt('Opções da lista, separadas por ponto e vírgula (;):', field.options.list.join('; '));
    if (txt === null) return;
    const free = confirm('Permitir texto livre na lista (opção "Outra")? OK = sim, Cancelar = não.');
    const options = txt.split(';').map(s => s.trim()).filter(Boolean);
    const url = el.dataset.scope === 'ticket' ? `/api/ticket-fields/${id}` : `/api/report-fields/${el.dataset.template}/${id}`;
    return act(() => api('PATCH', url, {options, free}).then(() => 'Opções atualizadas.'));
  },
  addOpt(el) { el.closest('form').querySelector('[data-opts]').insertAdjacentHTML('beforeend', optRowHtml()); },
  rmOpt(el) { el.parentElement.remove(); },
  cfgTab(el) { cfgTab = el.dataset.v; render(); },
  toggleUser(el) {
    const active = el.dataset.v === '1';
    return act(() => api('PATCH', `/api/users/${el.dataset.id}`, {active}).then(() => active ? 'Usuário reativado.' : 'Usuário desativado.'));
  },
  rmExtra(el) { el.closest('.extra-row').remove(); },
  copyLink(el) {
    if (!el.dataset.token) { toast('Link ainda não gerado. Atualize a página.', true); return; }
    const url = `${location.origin}/abrir?e=${slugify(el.dataset.company)}&t=${el.dataset.token}`;
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(url).then(() => toast('Link copiado.'), () => prompt('Copie o link:', url));
    }
    prompt('Copie o link:', url);
  },
  newLink(el) {
    if (!confirm('Gerar um novo link para este cliente? O link antigo deixa de funcionar.')) return;
    return act(() => api('POST', `/api/clients/${el.dataset.id}/link`, {}).then(() => 'Novo link gerado. Use “Copiar link”.'));
  },
  toggleClientForm() { showClientForm = !showClientForm; render(); },
  logout() { return api('POST', '/api/logout', {}).then(() => { S = null; renderLogin(); }); },
  csvTickets() {
    const cols = ['Número','Assunto','Cliente','Tipo de chamado','Prioridade','Status','Responsável','Equipe','SLA','Prazo'];
    const rows = filteredTickets().map(t => [t.id, t.title, t.client, t.category, t.priority, t.status, t.agent, t.team, SLA_LABEL[t.sla], t.due]);
    download('chamados.csv', '﻿' + [cols.map(csvEsc).join(';'), ...rows.map(r => r.map(csvEsc).join(';'))].join('\r\n'), 'text/csv;charset=utf-8;');
  },
  csvReport() {
    const list = S.tickets.filter(t => (!G.type || t.category === G.type) && (!G.status || t.status === G.status)).sort((a, b) => a.id - b.id);
    const cols = ['Número','Assunto','Cliente','Tipo de chamado','Prioridade','Status','Responsável','Equipe','SLA','Prazo'];
    const rows = list.map(t => [t.id, t.title, t.client, t.category, t.priority, t.status, t.agent, t.team, SLA_LABEL[t.sla], t.due]);
    download(`relatorio-${slug(G.type || 'todos-os-tipos')}.csv`, '﻿' + [cols.map(csvEsc).join(';'), ...rows.map(r => r.map(csvEsc).join(';'))].join('\r\n'), 'text/csv;charset=utf-8;');
  },
  printReport() { window.print(); }
};

document.addEventListener('submit', e => {
  const f = e.target; const k = f.dataset && f.dataset.form; if (!k) return;
  e.preventDefault();
  if (k === 'login') {
    api('POST', '/api/login', {email: f.elements.email.value, password: f.elements.password.value})
      .then(() => refresh()).then(() => { location.hash = '#/dashboard'; render(); })
      .catch(err => { const el = $('#login-err'); if (el) el.textContent = err.message; });
    return;
  }
  if (k === 'gen' || k === 'filter') { FORMS.gen(f); render(); return; }
  act(() => FORMS[k](f, e.submitter));
});
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset && el.dataset.change; if (!k) return;
  if (k === 'tplChange' || k === 'toggleVisit') { CHANGES[k](el); return; }
  if (k === 'filter' || k === 'filterRep' || k === 'agTec') { CHANGES[k](el); render(); return; }
  CHANGES[k](el);
});
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTS[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'csvTickets' || el.dataset.act === 'csvReport' || el.dataset.act === 'printReport') { fn(el); return; }
  const r = fn(el);
  if (r && typeof r.then === 'function') r.catch(err => toast(err.message, true));
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.input === 'search') {
    CF.q = e.target.value;
    const box = $('#ticket-rows'); if (box) box.innerHTML = ticketTable(filteredTickets());
  }
});
window.addEventListener('hashchange', () => { if (S) render(); });

(async function boot() {
  try { await refresh(); if (!location.hash) location.hash = '#/dashboard'; render(); }
  catch (e) { renderLogin(); }
})();
</script>
</body>
</html>
