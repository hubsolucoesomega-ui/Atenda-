<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abrir chamado · ATENDA</title>
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1d232b;--muted:#6b7480;--border:#d9dee5;--brand:#1f5fbf;--danger:#b42318;--ok:#067647}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151b;--card:#1a2029;--text:#e8ecf1;--muted:#9aa4b2;--border:#2c3541;--brand:#6ea8ff;--danger:#ff8a80;--ok:#6ce9a6}}
:root[data-theme="dark"]{--bg:#11151b;--card:#1a2029;--text:#e8ecf1;--muted:#9aa4b2;--border:#2c3541;--brand:#6ea8ff;--danger:#ff8a80;--ok:#6ce9a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
h1{font-size:22px;margin:0 0 4px}
.muted{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:0}
.num{font-size:30px;font-weight:800;color:var(--brand);margin:8px 0}
form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
textarea{min-height:110px;resize:vertical}
fieldset{border:1px solid var(--border);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:14px}
legend{color:var(--muted);font-size:14px;padding:0 4px}
button{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.free{margin-top:6px}
</style>
</head>
<body>
<main>
  <div class="card" id="app"><p class="muted">Carregando…</p></div>
</main>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var token = new URLSearchParams(location.search).get('t') || '';

  // Monta elementos com texto puro (sem innerHTML), para não abrir espaço para injeção.
  function node(tag, props, children) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'className') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function note(text, cls) { return node('p', {className: cls || 'muted', text: text}); }
  function clear() { app.textContent = ''; }
  function options(list, first) {
    return [node('option', {value: '', text: first || 'Selecione'})].concat(list);
  }
  function labeled(text, required, control, extra) {
    return node('label', {}, [node('span', {text: text + (required ? ' *' : '')}), control, extra || null]);
  }

  async function api(method, path, data) {
    var opt = {method: method, headers: {}};
    if (data !== undefined) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(data); }
    var res = await fetch(path, opt);
    var out = {};
    try { out = await res.json(); } catch (e) { /* sem corpo */ }
    if (!res.ok) throw new Error(out.error || 'Não foi possível concluir. Tente novamente.');
    return out;
  }

  function fieldControl(f) {
    var ctl = {f: f, input: null, free: null};
    if (f.kind === 'textarea') ctl.input = node('textarea', {maxlength: '4000'});
    else if (f.kind === 'number') ctl.input = node('input', {type: 'number', step: 'any', min: '0'});
    else if (f.kind === 'date') ctl.input = node('input', {type: 'date'});
    else if (f.kind === 'select') {
      var opts = f.options.list.map(function (o) { return node('option', {value: o, text: o}); });
      if (f.options.free) opts.push(node('option', {value: '__free__', text: 'Outra (texto livre)'}));
      ctl.input = node('select', {}, options(opts));
      if (f.options.free) {
        ctl.free = node('input', {maxlength: '255', placeholder: 'Digite a resposta', className: 'free'});
        ctl.free.style.display = 'none';
        ctl.input.addEventListener('change', function () {
          ctl.free.style.display = ctl.input.value === '__free__' ? 'block' : 'none';
        });
      }
    } else ctl.input = node('input', {maxlength: '255'});
    ctl.input.required = !!f.required;
    return ctl;
  }

  function renderForm(d) {
    clear();
    document.title = 'Abrir chamado · ' + d.company;
    app.appendChild(node('h1', {text: 'Abrir chamado'}));
    app.appendChild(note('Empresa: ' + d.company));

    var title = node('input', {maxlength: '160', minlength: '5', placeholder: 'Qual é a solicitação?'});
    title.required = true;
    var category = node('select', {}, options(d.categories.map(function (c) { return node('option', {value: c, text: c}); })));
    category.required = true;
    var sector = node('select', {}, options(d.sectors.map(function (s) { return node('option', {value: s.id, text: s.name}); })));
    sector.required = true;
    var description = node('textarea', {maxlength: '4000'});
    description.required = true;
    var controls = d.ticketFields.map(fieldControl);

    var err = note('', 'err');
    err.hidden = true;
    var btn = node('button', {type: 'submit', text: 'Enviar solicitação'});

    var form = node('form', {});
    form.appendChild(labeled('Assunto', true, title));
    form.appendChild(labeled('Tipo de chamado', true, category));
    form.appendChild(labeled('Setor', true, sector));
    form.appendChild(labeled('Descrição', true, description));
    if (controls.length) {
      var fs = node('fieldset', {}, [node('legend', {text: 'Informações adicionais'})]);
      controls.forEach(function (c) { fs.appendChild(labeled(c.f.label, c.f.required, c.input, c.free)); });
      form.appendChild(fs);
    }
    form.appendChild(err);
    form.appendChild(btn);

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      var custom = {};
      controls.forEach(function (c) {
        var v = c.input.value;
        if (c.f.kind === 'select' && v === '__free__') v = c.free ? c.free.value : '';
        custom[c.f.id] = v;
      });
      try {
        var out = await api('POST', '/api/public/tickets', {
          token: token, title: title.value, category: category.value, sector: sector.value,
          description: description.value, custom: custom
        });
        renderDone(out.id);
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
        btn.disabled = false;
      }
    });
    app.appendChild(form);
  }

  function renderDone(id) {
    clear();
    app.appendChild(node('h1', {text: 'Chamado aberto'}));
    app.appendChild(node('p', {className: 'num', text: '#' + id}));
    app.appendChild(note('Recebemos sua solicitação e nossa equipe dará continuidade. Guarde o número do chamado para acompanhar.'));
    var again = node('button', {type: 'button', text: 'Abrir outro chamado'});
    again.style.marginTop = '16px';
    again.addEventListener('click', function () { location.reload(); });
    app.appendChild(again);
  }

  function renderError(text) {
    clear();
    app.appendChild(node('h1', {text: 'Abrir chamado'}));
    app.appendChild(note(text, 'err'));
  }

  (async function boot() {
    if (!token) return renderError('Link inválido. Fale com a equipe.');
    try {
      var d = await api('GET', '/api/public/client?t=' + encodeURIComponent(token));
      if (d.unavailable) return renderError('Este formulário não está disponível no momento. Fale com a equipe.');
      renderForm(d);
    } catch (e) {
      renderError(e.message);
    }
  })();
})();
</script>
</body>
</html>
